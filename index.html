<!doctype html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Github Azure DevOps SpeedTest - Measure the latenecy to your nearest Microsoft Azure Data Center" />
  <meta name="author" content="Janusz Nowak" />
  <meta name="twitter:card"
    content="https://user-images.githubusercontent.com/5168275/224496856-971ca7f5-9982-4cdb-b48b-61eb8540019b.png">
  <meta name="twitter:site" content="@jnowwwak">
  <meta name="twitter:title" content="Github Azure DevOps SpeedTest">
  <meta name="twitter:description" content="Your Description">
  <meta name="twitter:image"
    content="https://user-images.githubusercontent.com/5168275/224496856-971ca7f5-9982-4cdb-b48b-61eb8540019b.png">

  <link rel="stylesheet" href="//maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
    integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous" />
  <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.0.3/jquery.min.js"></script>
  <title>Github Azure DevOps SpeedTest</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #212529;
      --jumbotron-bg: #e9ecef;
      --table-bg: #ffffff;
      --table-stripe: #f8f9fa;
      --border-color: #dee2e6;
    }

    body.dark-mode {
      --bg-color: #1a1a1a;
      --text-color: #e9ecef;
      --jumbotron-bg: #2d2d2d;
      --table-bg: #2d2d2d;
      --table-stripe: #3d3d3d;
      --border-color: #454545;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }

    .jumbotron {
      background-color: var(--jumbotron-bg);
      color: var(--text-color);
    }

    .table {
      background-color: var(--table-bg);
      color: var(--text-color);
    }

    .table tbody tr:hover {
      background-color: var(--table-stripe);
    }

    .dark-mode-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      background-color: var(--jumbotron-bg);
      color: var(--text-color);
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 1000;
      transition: all 0.3s;
    }

    .dark-mode-toggle:hover {
      transform: scale(1.05);
    }

    .export-buttons {
      margin: 20px 0;
    }

    .export-buttons button {
      margin-right: 10px;
      margin-bottom: 10px;
    }

    .btn-warning {
      background-color: #ffc107;
      border-color: #ffc107;
      color: #212529;
    }

    .btn-warning:hover {
      background-color: #e0a800;
      border-color: #d39e00;
    }

    .container {
      /*width: 970px;*/
    }

    .icon {
      width: 25px;
      margin-right: 8px;
    }

    .results-table {
      margin-bottom: 75px;
    }

    tr {
      display: flex;
      width: 100%;
    }

    td,
    th {
      flex: 1;
    }

    svg {
      width: 200px;
      height: 100%;
    }

    @media screen and (max-width: 770px) {
      .no-mobile {
        display: none;
      }

      .dark-mode-toggle {
        top: 10px;
        right: 10px;
        padding: 8px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="jumbotron">
    <div class="container">
      <h1 class="display-4">Github Azure DevOps SpeedTest</h1>
      <p class="lead">
        Measures the network latency between your browser and GitHub and each
        of the Azure DevOps region.
      </p>
    </div>
  </div>
  <div class="container">
    <div id="content">Starting...</div>
  </div>

  <noscript>You need to enabled JavaScript for this web application to
    work.</noscript>

  <script src="index.min.js"></script>
</body>

</html>
